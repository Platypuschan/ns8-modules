name: Publish NS8 catalog

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '25 0,6,12,18 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ns8-catalog-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate catalog from public GHCR releases
        run: python3 scripts/generate.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
